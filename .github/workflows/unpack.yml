name: unpack
on: push
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          [ -f tzur-tone-src.zip ] || exit 0
          unzip -oq tzur-tone-src.zip
          rm -f tzur-tone-src.zip
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Unpack tzur-tone source"
          git push
